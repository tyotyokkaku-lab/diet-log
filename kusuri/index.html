<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>おくすりチェック</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="おくすり">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <main>
    <header class="day">
      <button type="button" id="prev" class="nav" aria-label="前の日">‹</button>
      <div class="day-mid">
        <div id="dateLabel" class="date"></div>
        <div id="dayNo" class="dayno"></div>
      </div>
      <button type="button" id="next" class="nav" aria-label="次の日">›</button>
    </header>
    <button type="button" id="today" class="today" hidden>今日にもどる</button>

    <div class="progress"><div id="bar"></div></div>
    <p id="summary" class="summary"></p>

    <div id="slots"></div>

    <section class="history">
      <h2>これまでの記録</h2>
      <ol id="history"></ol>
    </section>

    <details class="settings">
      <summary>設定</summary>
      <label class="setrow">飲み始めた日
        <input type="date" id="start">
      </label>
      <label class="setrow">1日目は
        <select id="firstSlot">
          <option value="m">朝から</option>
          <option value="e">夕から</option>
          <option value="b">寝る前から</option>
        </select>
      </label>
      <p class="note">飲み薬は「あと何回」が0になると表示されなくなります。点鼻薬は、薬の名前をタップして「もう使わない」にすると消えます。</p>
      <p class="note">記録はこのスマホのブラウザの中にだけ保存されます。</p>
    </details>
  </main>

  <button type="button" id="undo" class="undo" hidden>↶ 1つ前に戻す</button>

  <dialog id="info">
    <form method="dialog">
      <div id="infoBody"></div>
      <div class="dlg-actions">
        <button type="button" id="infoDone" class="ghost"></button>
        <button value="close" class="primary">閉じる</button>
      </div>
    </form>
  </dialog>

  <script src="app.js?v=5"></script>
</body>
</html>
