<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>内税計算</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="内税計算">
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <main>
    <h1>内税計算</h1>

    <div class="row">
      <label for="amount">金額</label>
      <input id="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
      <span class="unit">円</span>
    </div>

    <div class="row">
      <label for="rate">税率</label>
      <input id="rate" type="text" inputmode="decimal" autocomplete="off" value="10">
      <span class="unit">%</span>
    </div>
    <div class="chips">
      <button type="button" data-rate="10">10%</button>
      <button type="button" data-rate="8">8%（軽減）</button>
    </div>

    <div class="row">
      <label for="tax">内税</label>
      <output id="tax" class="box"></output>
      <span class="unit">円</span>
    </div>

    <div class="row">
      <label for="net">税抜</label>
      <output id="net" class="box strong"></output>
      <span class="unit">円</span>
    </div>

    <p class="note">※端数は切り捨て（税抜＝金額−内税）</p>
  </main>
  <script src="app.js?v=1"></script>
</body>
</html>
